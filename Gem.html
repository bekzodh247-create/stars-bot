<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Hisoblovchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #1d2129;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            box-sizing: border-box;
        }
        .star-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
            border-radius: 18px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(255, 167, 81, 0.3);
            margin-bottom: 15px;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 700;
        }
        p.subtitle {
            color: #8a96a3;
            font-size: 13px;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .input-label {
            font-size: 13px;
            font-weight: 600;
            color: #4e5d6c;
            margin-bottom: 6px;
            display: block;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            font-size: 16px;
            border: 2px solid #e4e9f0;
            border-radius: 16px;
            outline: none;
            background: #fafbfc;
            color: #1d2129;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .input-box span {
            position: absolute;
            right: 15px;
            font-size: 18px;
        }
        .result-card {
            background: #fffdf5;
            border: 1px solid #fef3c7;
            padding: 18px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-align: left;
        }
        .result-title {
            font-size: 12px;
            color: #92400e;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .result-value {
            font-size: 26px;
            font-weight: 800;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #6b7280;
            padding: 0 5px;
            margin-bottom: 20px;
        }
        .info-row span:last-child {
            font-weight: 600;
            color: #111827;
        }
        .btn-clear {
            width: 100%;
            background: #111827;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-clear:active {
            background: #1f2937;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="star-icon">⭐</div>
        <h2>Stars Hisoblovchi</h2>
        <p class="subtitle">Hisoblamoqchi boʻlgan Stars miqdorini kiriting</p>

        <div class="input-group">
            <label class="input-label">Stars miqdori</label>
            <div class="input-box">
                <input type="number" id="starsInput" placeholder="Masalan: 15" oninput="calculate()">
                <span>⭐</span>
            </div>
        </div>

        <div class="result-card">
            <div class="result-title">Jami toʻlov</div>
            <div class="result-value" id="resultText">
                💰 0 soʻm
            </div>
        </div>

        <div class="info-row">
            <span>⭐ 1 Stars</span>
            <span id="pricePerStarText">200 soʻm</span>
        </div>

        <button class="btn-clear" onclick="clearAll()">
            🔄 Tozalash
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 1 ta Stars narxi (Buni botdagi narx bilan bir xil qo'yasiz)
        let pricePerStar = 200;

        function calculate() {
            let inputVal = document.getElementById('starsInput').value;
            let resultDiv = document.getElementById('resultText');

            if (inputVal === "" || inputVal < 0) {
                resultDiv.innerHTML = "💰 0 soʻm";
            } else {
                let total = inputVal * pricePerStar;
                resultDiv.innerHTML = `💰 ${total.toLocaleString()} soʻm`;
            }
        }

        function clearAll() {
            document.getElementById('starsInput').value = "";
            document.getElementById('resultText').innerHTML = "💰 0 soʻm";
        }
    </script>
</body>
</html>
