<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Kalkulyator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 9px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 15px;
            margin-top: 10px;
            text-align: center;
        }
        h2 { color: #2ea6ff; }
        .result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #28a745;
        }
      h1{
        color: #2ea6ff
      }
      body{
    background: linear-gradient(hwb(0 100% 0%), hwb(0 100% 0%));
    height: 100vh;
      }
      .header {
            text-align: center;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid black(0, 0, 0, 0.10196078431372549);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #000000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 10;
            border-radius: 15px;
      }
    </style>
</head>
<body>
  <div class="header">
    <i class="fa-brands fa-telegram" style="color: #24A1DE; margin-right: 8px;"></i>@SeGiftbot
  </div>
    <div class="card">
        <h2>🌟 Stars Hisoblovchi</h2>
        <p>hisoblamoqchi boʻlgan Stars miqdorini kiriting:</p>
        <input type="number" id="starsInput" placeholder="Masalan: 15" oninput="calculate()">
        <div class="result" id="resultText">Jami: 0 soʻm</div>
    </div>
  <h1>Stars Kerak Boʻlsa Yozing</h1>
  <h2>@WERUZB</h2>
    <script>
        let starPrice = 200; // 1 ta stars narxi (so'mda)

        function calculate() {
            let count = document.getElementById('starsInput').value;
            if(count === "" || count < 0) {
                document.getElementById('resultText').innerText = "Jami: 0 soʻm";
                return;
            }
            let total = count * starPrice;
            document.getElementById('resultText').innerHTML = `Jami: <b>${total.toLocaleString()} soʻm</b>`;
        }
    </script>
</body>
</html>
