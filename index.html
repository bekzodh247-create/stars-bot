<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Kalkulyator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
        }
        h2 { color: #2ea6ff; }
        .result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌟 Stars Kalkulyator</h2>
        <p>Sotib olmoqchi boʻlgan Stars miqdorini kiriting:</p>
        <input type="number" id="starsInput" placeholder="Masalan: 50" oninput="calculate()">
        <div class="result" id="resultText">Jami: 0 soʻm</div>
    </div>

    <script>
        let starPrice = 200; // 1 ta stars narxi (so'mda)

        function calculate() {
            let count = document.getElementById('starsInput').value;
            if(count === "" || count < 0) {
                document.getElementById('resultText').innerText = "Jami: 0 soʻm";
                return;
            }
            let total = count * starPrice;
            document.getElementById('resultText').innerHTML = `Jami: <b>${total.toLocaleString()} soʻm</b>`;
        }
    </script>
</body>
</html>
